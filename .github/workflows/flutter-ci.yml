name: Reusable Flutter CI

on:
  workflow_call:
    inputs:
      flutter-channel:
        description: Flutter channel used when flutter-version is empty.
        type: string
        required: false
        default: stable
      flutter-version:
        description: Optional exact Flutter SDK version. Leave empty to use the selected channel.
        type: string
        required: false
        default: ''
      run-analyze:
        description: Run flutter analyze.
        type: boolean
        required: false
        default: true
      run-tests:
        description: Run Flutter unit and widget tests when test files exist.
        type: boolean
        required: false
        default: true
      run-screenshot-tests:
        description: Compare golden/screenshot tests against checked-in baselines when present.
        type: boolean
        required: false
        default: true
      generate-coverage-report:
        description: Create detailed per-file coverage and uncovered-line reports.
        type: boolean
        required: false
        default: true
      check-format:
        description: Fail if Dart files under lib or test are not formatted.
        type: boolean
        required: false
        default: false
      build-apk:
        description: Build and verify an Android release APK.
        type: boolean
        required: false
        default: true
      target-platform:
        description: Flutter Android target platform. Defaults to arm64-v8a only.
        type: string
        required: false
        default: android-arm64
      generate-android:
        description: Generate Android project files only when android/ does not exist.
        type: boolean
        required: false
        default: false
      android-project-name:
        description: Project name passed to flutter create when generate-android is enabled.
        type: string
        required: false
        default: app
      android-organization:
        description: Organization passed to flutter create when generate-android is enabled.
        type: string
        required: false
        default: com.example
      run-emulator-tests:
        description: Run integration_test/ on a headless Android emulator.
        type: boolean
        required: false
        default: false
      emulator-api-level:
        description: Android API level for the emulator.
        type: number
        required: false
        default: 35
      run-security-audit:
        description: Scan Git history for secrets and dependency lockfiles for known vulnerabilities.
        type: boolean
        required: false
        default: true
      fail-on-security-findings:
        description: Fail the security job if either scanner reports findings. Scanner installation failures always fail.
        type: boolean
        required: false
        default: false
      artifact-name:
        description: Name of the uploaded APK artifact.
        type: string
        required: false
        default: flutter-android-arm64-apk
      enable-targeted-pr-tests:
        description: Opt-in conservative test selection for pull requests only; all other runs use the full suite.
        type: boolean
        required: false
        default: false
      run-apk-smoke-test:
        description: Install and launch the APK on a headless Android emulator and capture failure diagnostics.
        type: boolean
        required: false
        default: false
      min-coverage-percent:
        description: Optional minimum overall line coverage percent; 0 disables this gate.
        type: number
        required: false
        default: 0
      max-apk-size-mb:
        description: Optional maximum compressed APK size in MiB; 0 disables this gate.
        type: number
        required: false
        default: 0
      max-apk-entry-size-mb:
        description: Optional maximum expanded size of a single APK entry in MiB; 0 disables this gate.
        type: number
        required: false
        default: 0
      forbid-permissions:
        description: Optional comma- or newline-separated Android permissions forbidden in the built APK.
        type: string
        required: false
        default: ''
      fail-on-new-warnings:
        description: Fail if a warning signature appears that is absent from the cached previous-run baseline.
        type: boolean
        required: false
        default: false
      generate-artifact-attestation:
        description: Generate signed GitHub artifact provenance for the verified APK; requires caller permissions and eligible repository.
        type: boolean
        required: false
        default: false

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.defaultBranchName
  GIT_CONFIG_VALUE_1: false

permissions:
  contents: read

jobs:
  flutter:
    if: ${{ inputs.run-analyze || inputs.run-tests || inputs.check-format || inputs.build-apk || inputs.run-emulator-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Snapshot the complete project before inspection
        id: source-snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          date +%s > ci-reports/run-start-epoch.txt
          test -f .git/HEAD
          find . -path './.git' -prune -o -path './ci-reports' -prune -o -type f -printf '%P\n' \
            | sort > ci-reports/source-file-list.txt
          find . -path './.git' -prune -o -path './ci-reports' -prune -o -type f -print0 \
            | sort -z | xargs -0 -r sha256sum > ci-reports/source-manifest.sha256
          tar --exclude='./.git' --exclude='./ci-reports' -czf "$RUNNER_TEMP/project-source-snapshot.tar.gz" .
          cp "$RUNNER_TEMP/project-source-snapshot.tar.gz" ci-reports/
          {
            echo "## Complete source snapshot"
            echo "- Files tracked/untracked: $(wc -l < ci-reports/source-file-list.txt)"
            echo "- SHA-256 entries: $(wc -l < ci-reports/source-manifest.sha256)"
            echo "Full checkout captured before dependency resolution or analysis."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore previous build history
        id: history-restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .ci-history
          key: flutter-build-history-${{ github.repository_id }}-${{ github.ref_name }}-${{ inputs.target-platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            flutter-build-history-${{ github.repository_id }}-${{ github.ref_name }}-${{ inputs.target-platform }}-
            flutter-build-history-${{ github.repository_id }}-${{ github.event.repository.default_branch }}-${{ inputs.target-platform }}-

      - name: Verify Flutter project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || {
            echo "::error::pubspec.yaml was not found at the repository root."
            exit 1
          }
          mkdir -p ci-reports

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Generate Android files when explicitly requested
        if: ${{ inputs.generate-android && inputs.build-apk && !cancelled() }}
        shell: bash
        env:
          ANDROID_PROJECT_NAME: ${{ inputs.android-project-name }}
          ANDROID_ORGANIZATION: ${{ inputs.android-organization }}
        run: |
          set -euo pipefail
          if [[ ! -d android ]]; then
            flutter create --platforms=android \
              --project-name "$ANDROID_PROJECT_NAME" \
              --org "$ANDROID_ORGANIZATION" .
          else
            echo "android/ already exists; leaving native project files unchanged."
          fi

      - name: Get dependencies
        id: pub-get
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s pubspec.lock ]]; then
            echo "Committed pubspec.lock found; enforcing exact locked dependency resolution."
            flutter pub get --enforce-lockfile 2>&1 | tee ci-reports/flutter-pub-get.log
          else
            echo "No committed pubspec.lock; resolving dependencies from declared constraints without upgrading package constraints."
            flutter pub get 2>&1 | tee ci-reports/flutter-pub-get.log
          fi

      - name: Report dependency graph and outdated packages without changing versions
        id: dependency-report
        if: ${{ always() && steps.pub-get.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          flutter pub deps --style=compact > ci-reports/flutter-dependency-tree.txt 2>&1
          deps_status=$?
          set +e
          flutter pub outdated --no-transitive 2>&1 | tee ci-reports/flutter-pub-outdated.log
          outdated_status=${PIPESTATUS[0]}
          set -e
          {
            echo "flutter pub deps exit code: $deps_status"
            echo "flutter pub outdated exit code: $outdated_status"
            echo "Dependency versions were not changed."
          } > ci-reports/flutter-dependency-report.log
          exit "$deps_status"

      - name: Analyze Dart code
        id: analyze
        if: ${{ inputs.run-analyze }}
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ci-reports/flutter-analyze.log

      - name: Check Dart formatting
        id: format
        if: ${{ inputs.check-format }}
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          [[ -d lib ]] && paths+=(lib)
          [[ -d test ]] && paths+=(test)
          if (( ${#paths[@]} == 0 )); then
            echo "No lib/ or test/ directories; format check skipped."
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${paths[@]}" 2>&1 | tee ci-reports/dart-format.log

      - name: Determine changed files and select safe PR tests
        id: impact
        if: ${{ inputs.enable-targeted-pr-tests && inputs.run-tests }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MIN_COVERAGE_PERCENT: ${{ inputs.min-coverage-percent }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          : > ci-reports/changed-files.txt
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_NUMBER" ]]; then
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > ci-reports/changed-files.txt; then
              echo "::warning::Could not retrieve pull-request file changes; selecting the complete test suite."
              : > ci-reports/changed-files.txt
            fi
          else
            echo "Not a pull request or no PR number; full suite will be selected."
          fi
          python3 scripts/ci_enhancements.py impact --event "$GITHUB_EVENT_NAME" \
            --changed-file ci-reports/changed-files.txt --output-dir ci-reports \
            --min-coverage "$MIN_COVERAGE_PERCENT" --targeted-tests

      - name: Run unit and widget tests
        id: tests
        if: ${{ inputs.run-tests }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d test ]] || ! find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            echo "No Dart test files found under test/; unit/widget tests skipped." | tee ci-reports/flutter-test.log
            exit 0
          fi
          if [[ "${{ inputs.enable-targeted-pr-tests }}" == "true" && "$GITHUB_EVENT_NAME" == "pull_request" && -s ci-reports/change-impact.json ]]; then
            mode="$(jq -r '.mode // "full"' ci-reports/change-impact.json)"
            case "$mode" in
              skip)
                echo "Documentation-only pull request; Flutter tests skipped by conservative change-impact analysis." | tee ci-reports/flutter-test.log
                exit 0
                ;;
              targeted)
                mapfile -t files < <(jq -r '.target_tests[]?' ci-reports/change-impact.json)
                if (( ${#files[@]} > 0 )); then
                  printf 'Running mapped tests only: %s\n' "${files[*]}" | tee ci-reports/flutter-test.log
                  set -o pipefail
                  flutter test --coverage "${files[@]}" 2>&1 | tee -a ci-reports/flutter-test.log
                  exit 0
                fi
                echo "No safe targeted tests selected; falling back to the complete suite." | tee ci-reports/flutter-test.log
                ;;
              *)
                echo "Change impact requires the full suite: $(jq -r '.reason' ci-reports/change-impact.json)" | tee ci-reports/flutter-test.log
                ;;
            esac
          fi
          set -o pipefail
          flutter test --coverage 2>&1 | tee ci-reports/flutter-test.log

      - name: Compare screenshot and golden baselines
        id: screenshot-tests
        if: ${{ inputs.run-screenshot-tests && inputs.run-tests }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -lER 'matchesGoldenFile|matchesReferenceImage' --include='*_test.dart' test 2>/dev/null || true)
          if (( ${#files[@]} == 0 )); then
            echo "No golden/screenshot matcher tests found; visual comparison skipped." | tee ci-reports/screenshot-tests.log
            exit 0
          fi
          printf '%s\n' "${files[@]}" | tee ci-reports/screenshot-test-files.txt
          {
            echo "Detected screenshot/golden matcher tests:"
            printf '%s\n' "${files[@]}"
            echo
            echo "The complete Flutter test suite above already executed these tests. Not rerunning them to avoid duplicate execution; review flutter-test.log for actual matcher failures."
          } | tee ci-reports/screenshot-tests.log

      - name: Generate detailed coverage and uncovered-line report
        id: coverage-report
        if: ${{ inputs.generate-coverage-report && inputs.run-tests && always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s coverage/lcov.info ]]; then
            echo "No coverage/lcov.info; no test coverage data exists." | tee ci-reports/coverage-report.log
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=[]; cur=None
          for line in Path("coverage/lcov.info").read_text(errors="replace").splitlines():
              if line.startswith("SF:"):
                  cur={"file":line[3:],"hit":0,"found":0,"uncovered":[]}; files.append(cur)
              elif cur is not None and line.startswith("DA:"):
                  p=line[3:].split(",")
                  if len(p)>1:
                      n,c=int(p[0]),int(p[1]); cur["found"]+=1; cur["hit"]+=int(c>0)
                      if c==0: cur["uncovered"].append(n)
              elif cur is not None and line.startswith("LF:"): cur["found"]=max(cur["found"],int(line[3:]))
              elif cur is not None and line.startswith("LH:"): cur["hit"]=int(line[3:])
          found=sum(x["found"] for x in files); hit=sum(x["hit"] for x in files)
          pct=100*hit/found if found else 0
          report=["# Test coverage", "", f"- Lines covered: {hit}/{found} ({pct:.2f}%)",
                  f"- Files with coverage: {len(files)}",
                  f"- Uncovered executable lines: {sum(len(x['uncovered']) for x in files)}", "",
                  "| File | Covered | Total | Percent | Uncovered lines |","|---|---:|---:|---:|---|"]
          uncovered=[]
          for x in files:
              ratio=100*x["hit"]/x["found"] if x["found"] else 0
              report.append(f"| {x['file']} | {x['hit']} | {x['found']} | {ratio:.2f}% | {', '.join(map(str,x['uncovered'])) or 'none'} |")
              if x["uncovered"]: uncovered.append(f"{x['file']}: {', '.join(map(str,x['uncovered']))}")
          Path("ci-reports/coverage-summary.md").write_text("\n".join(report)+"\n")
          Path("ci-reports/uncovered-lines.txt").write_text("\n".join(uncovered)+"\n")
          Path("ci-reports/coverage.json").write_text(json.dumps({"covered_lines":hit,"total_lines":found,"coverage_percent":round(pct,2),"files":files},indent=2))
          print(f"Coverage: {hit}/{found} lines ({pct:.2f}%).")
          PY

      - name: Report suggested safe Dart fixes (does not modify source)
        id: fix-report
        if: ${{ inputs.run-analyze }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dart fix --dry-run 2>&1 | tee ci-reports/dart-fix-suggestions.log

      - name: Run integration tests on Android emulator
        id: emulator
        if: ${{ inputs.run-emulator-tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.emulator-api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: |
            set -euo pipefail
            if ! find integration_test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
              echo "run-emulator-tests is enabled, but no integration_test/*_test.dart files were found."
              exit 1
            fi
            flutter test integration_test --no-pub

      - name: Refresh Android plugin registration after dependency resolution
        id: config-only
        if: ${{ inputs.build-apk }}
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --config-only 2>&1 | tee ci-reports/flutter-build-config.log

      - name: Build Android release APK
        id: build
        if: ${{ inputs.build-apk }}
        shell: bash
        env:
          TARGET_PLATFORM: ${{ inputs.target-platform }}
        run: |
          set -o pipefail
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          mkdir -p "$OUTPUT_DIR"
          rm -f "$OUTPUT_DIR/app-release.apk"
          flutter build apk --release --target-platform "$TARGET_PLATFORM" --split-per-abi --no-pub 2>&1 | tee ci-reports/flutter-build-apk.log

          case "$TARGET_PLATFORM" in
            android-arm64) EXPECTED_ABI="arm64-v8a" ;;
            android-arm) EXPECTED_ABI="armeabi-v7a" ;;
            android-x64) EXPECTED_ABI="x86_64" ;;
            android-riscv64) EXPECTED_ABI="riscv64" ;;
            *)
              echo "::error::Unsupported single release target platform: $TARGET_PLATFORM"
              exit 1
              ;;
          esac

          SELECTED_APK="$OUTPUT_DIR/app-$EXPECTED_ABI-release.apk"
          if [[ ! -s "$SELECTED_APK" ]]; then
            echo "::error::Flutter did not produce the expected split APK: $SELECTED_APK"
            find "$OUTPUT_DIR" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' | sort
            exit 1
          fi
          cp "$SELECTED_APK" "$OUTPUT_DIR/app-release.apk"
          echo "Selected target APK: $SELECTED_APK"
          echo "Normalized release APK: $OUTPUT_DIR/app-release.apk"
          echo "Selected ABI: $EXPECTED_ABI" | tee ci-reports/apk-selected-abi.txt

      - name: Verify complete APK archive and inventory all entries
        id: apk-inventory
        if: ${{ inputs.build-apk }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" > ci-reports/apk-archive-integrity.log
          unzip -Z1 "$APK" > ci-reports/apk-contents.txt
          zipinfo -l "$APK" > ci-reports/apk-file-details.txt
          mkdir -p "$RUNNER_TEMP/apk-complete"
          unzip -q "$APK" -d "$RUNNER_TEMP/apk-complete"
          find "$RUNNER_TEMP/apk-complete" -type f -print0 | sort -z | xargs -0 -r sha256sum > ci-reports/apk-extracted-sha256.txt
          echo "Archive entries: $(wc -l < ci-reports/apk-contents.txt)" | tee ci-reports/apk-inventory-summary.txt
          echo "Extracted files: $(wc -l < ci-reports/apk-extracted-sha256.txt)" | tee -a ci-reports/apk-inventory-summary.txt
          echo "APK SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)" | tee -a ci-reports/apk-inventory-summary.txt

      - name: Verify APK, signature, and ABI
        id: verify-apk
        if: ${{ inputs.build-apk }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK" || {
            echo "::error::The expected APK was not produced: $APK"
            exit 1
          }

          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" 2>&1 | tee ci-reports/apksigner-verify.log

          if [[ "${{ inputs.target-platform }}" == "android-arm64" ]]; then
            ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $2 != "" {print $2}' | sort -u | tr '\n' ' ' | xargs)"
            echo "Native ABIs in APK: ${ABIS:-none}"
            if [[ "$ABIS" != "arm64-v8a" ]]; then
              echo "::error::Expected exactly arm64-v8a native libraries; found: ${ABIS:-none}"
              exit 1
            fi
          fi

          sha256sum "$APK" | tee ci-reports/apk-sha256.txt

      - name: Generate APK metadata and enforce size and permission rules
        id: apk-audit
        if: ${{ inputs.build-apk && always() && steps.verify-apk.outcome == 'success' }}
        shell: bash
        env:
          TARGET_PLATFORM: ${{ inputs.target-platform }}
          MAX_APK_ENTRY_SIZE_MB: ${{ inputs.max-apk-entry-size-mb }}
          FORBID_PERMISSIONS: ${{ inputs.forbid-permissions }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > ci-reports/apk-badging.txt
          case "$TARGET_PLATFORM" in
            android-arm64) EXPECTED_ABI="arm64-v8a" ;;
            android-arm) EXPECTED_ABI="armeabi-v7a" ;;
            android-x64) EXPECTED_ABI="x86_64" ;;
            android-riscv64) EXPECTED_ABI="riscv64" ;;
            *) echo "::error::Unsupported target platform during APK audit: $TARGET_PLATFORM"; exit 1 ;;
          esac
          python3 scripts/ci_enhancements.py apk-audit \
            --apk "$APK" --badging ci-reports/apk-badging.txt \
            --expected-abi "$EXPECTED_ABI" --max-entry-size-mb "$MAX_APK_ENTRY_SIZE_MB" \
            --forbid-permissions "$FORBID_PERMISSIONS" --output-dir ci-reports

      - name: Enable KVM for Android emulator smoke test
        if: ${{ inputs.run-apk-smoke-test && inputs.build-apk && steps.verify-apk.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable on this runner; emulator smoke test may not boot without VM acceleration."
          fi

      - name: Run Android install-and-launch smoke test
        id: apk-smoke
        if: ${{ inputs.run-apk-smoke-test && inputs.build-apk && steps.verify-apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.emulator-api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: bash "$GITHUB_WORKSPACE/scripts/android_smoke_test.sh"
      - name: Upload APK
        if: ${{ inputs.build-apk && always() && steps.verify-apk.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Collect Android diagnostics after a failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          mkdir -p ci-reports
          timeout 12s adb logcat -d > ci-reports/android-logcat.txt 2>&1
          logcat_status=$?
          if (( logcat_status != 0 )); then
            echo "adb logcat failed or timed out (exit $logcat_status)." >> ci-reports/android-logcat.txt
          fi
          timeout 12s adb shell dumpsys meminfo > ci-reports/android-meminfo.txt 2>&1
          meminfo_status=$?
          if (( meminfo_status != 0 )); then
            echo "adb dumpsys meminfo failed or timed out (exit $meminfo_status)." >> ci-reports/android-meminfo.txt
          fi
          exit 0

      - name: Analyze warning regressions and classify build logs
        id: warning-analysis
        if: ${{ always() && steps.source-snapshot.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_enhancements.py analyze-logs \
            --log-root ci-reports --baseline .ci-history/warning-signatures.json --output-dir ci-reports

      - name: Enforce configurable quality gates
        id: quality-gates
        if: ${{ always() && steps.source-snapshot.outcome == 'success' && (inputs.min-coverage-percent > 0 || inputs.max-apk-size-mb > 0 || inputs.fail-on-new-warnings) }}
        shell: bash
        env:
          MIN_COVERAGE: ${{ inputs.min-coverage-percent }}
          MAX_APK_SIZE: ${{ inputs.max-apk-size-mb }}
          FAIL_ON_NEW_WARNINGS: ${{ inputs.fail-on-new-warnings }}
        run: |
          set -euo pipefail
          args=(quality --coverage-json ci-reports/coverage.json --apk build/app/outputs/flutter-apk/app-release.apk \
            --log-analysis ci-reports/log-analysis.json --min-coverage "$MIN_COVERAGE" \
            --max-apk-size "$MAX_APK_SIZE" --output-dir ci-reports)
          if [[ "$FAIL_ON_NEW_WARNINGS" == "true" ]]; then args+=(--fail-on-new-warnings); fi
          python3 scripts/ci_enhancements.py "${args[@]}"

      - name: Collect full command logs and compare build history
        id: report-collector
        if: ${{ always() }}
        shell: bash
        env:
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          SCREENSHOT_RESULT: ${{ steps.screenshot-tests.outcome }}
          COVERAGE_RESULT: ${{ steps.coverage-report.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          APK_RESULT: ${{ steps.verify-apk.outcome }}
          EMULATOR_RESULT: ${{ steps.emulator.outcome }}
          PUB_GET_RESULT: ${{ steps.pub-get.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-reports .ci-history
          apk_hash=""
          apk_size_bytes=0
          lock_hash=""
          coverage_pct=""
          warning_count=0
          run_duration_seconds=0
          [[ ! -f build/app/outputs/flutter-apk/app-release.apk ]] || apk_hash="$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')"
          [[ ! -f build/app/outputs/flutter-apk/app-release.apk ]] || apk_size_bytes="$(stat -c %s build/app/outputs/flutter-apk/app-release.apk)"
          [[ ! -s pubspec.lock ]] || lock_hash="$(sha256sum pubspec.lock | awk '{print $1}')"
          [[ ! -s ci-reports/coverage.json ]] || coverage_pct="$(jq -r '.coverage_percent // empty' ci-reports/coverage.json)"
          [[ ! -s ci-reports/log-analysis.json ]] || warning_count="$(jq -r '.new_warning_count // 0' ci-reports/log-analysis.json)"
          if [[ -s ci-reports/run-start-epoch.txt ]]; then
            start_epoch="$(cat ci-reports/run-start-epoch.txt)"
            now_epoch="$(date +%s)"
            if [[ "$start_epoch" =~ ^[0-9]+$ ]] && (( now_epoch >= start_epoch )); then run_duration_seconds=$((now_epoch-start_epoch)); fi
          fi
          printf 'pubspec.lock SHA-256: %s\n' "${lock_hash:-not available}" | tee ci-reports/pubspec-lock-sha256.txt
          jq -cn \
            --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg pub "$PUB_GET_RESULT" --arg analyze "$ANALYZE_RESULT" --arg tests "$TEST_RESULT" \
            --arg screenshots "$SCREENSHOT_RESULT" --arg coverage "$COVERAGE_RESULT" \
            --arg format "$FORMAT_RESULT" --arg emulator "$EMULATOR_RESULT" \
            --arg build "$BUILD_RESULT" --arg verify "$APK_RESULT" --arg apk_hash "$apk_hash" --arg lock_hash "$lock_hash" \
            --arg coverage_pct "$coverage_pct" --argjson apk_size_bytes "$apk_size_bytes" \
            --argjson run_duration_seconds "$run_duration_seconds" --argjson warning_count "$warning_count" \
            '{repository:$repo,ref:$ref,commit:$sha,run_id:$run,attempt:$attempt,date:$date,pub_get:$pub,analyze:$analyze,tests:$tests,screenshot_tests:$screenshots,coverage:$coverage,format:$format,emulator:$emulator,build:$build,apk_verify:$verify,apk_sha256:$apk_hash,pubspec_lock_sha256:$lock_hash,coverage_percent:(if $coverage_pct=="" then null else ($coverage_pct|tonumber) end),apk_size_bytes:$apk_size_bytes,run_duration_seconds:$run_duration_seconds,new_warning_count:$warning_count}' \
            >> .ci-history/history.jsonl
          cp .ci-history/history.jsonl ci-reports/build-history.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          records=[json.loads(s) for s in Path(".ci-history/history.jsonl").read_text().splitlines() if s.strip()]
          cur=records[-1]; prev=records[-2] if len(records)>1 else None
          keys=["analyze","tests","screenshot_tests","coverage","format","emulator","build","apk_verify"]
          lines=["# Build history comparison","",f"- Current run: {cur['run_id']} ({cur['commit'][:12]})"]
          if prev:
              lines += [f"- Previous run: {prev['run_id']} ({prev['commit'][:12]})","","| Check | Previous | Current | Change |","|---|---|---|---|"]
              for k in keys:
                  a,b=prev.get(k,"unknown"),cur.get(k,"unknown")
                  lines.append(f"| {k} | {a} | {b} | {'changed' if a!=b else 'same'} |")
              lines += ["",f"- Previous APK SHA-256: {prev.get('apk_sha256') or 'not built'}",
                        f"- Current APK SHA-256: {cur.get('apk_sha256') or 'not built'}",
                        f"- APK hash changed: {'yes' if prev.get('apk_sha256')!=cur.get('apk_sha256') else 'no'}",
                        f"- Previous pubspec.lock SHA-256: {prev.get('pubspec_lock_sha256') or 'not available'}",
                        f"- Current pubspec.lock SHA-256: {cur.get('pubspec_lock_sha256') or 'not available'}",
                        f"- Dependency lock hash changed: {'yes' if prev.get('pubspec_lock_sha256')!=cur.get('pubspec_lock_sha256') else 'no'}",
                        f"- Previous APK size: {prev.get('apk_size_bytes') or 'not built'} bytes",
                        f"- Current APK size: {cur.get('apk_size_bytes') or 'not built'} bytes",
                        f"- APK size delta: {(cur.get('apk_size_bytes') - prev.get('apk_size_bytes')) if cur.get('apk_size_bytes') is not None and prev.get('apk_size_bytes') is not None else 'not available'} bytes",
                        f"- Previous coverage: {prev.get('coverage_percent') if prev.get('coverage_percent') is not None else 'not available'}%",
                        f"- Current coverage: {cur.get('coverage_percent') if cur.get('coverage_percent') is not None else 'not available'}%",
                        f"- Coverage delta: {((cur.get('coverage_percent') or 0)-(prev.get('coverage_percent') or 0)):.2f} percentage points" if cur.get('coverage_percent') is not None and prev.get('coverage_percent') is not None else "- Coverage delta: not available",
                        f"- Previous run duration: {prev.get('run_duration_seconds', 'unknown')} seconds",
                        f"- Current run duration: {cur.get('run_duration_seconds', 'unknown')} seconds",
                        f"- Duration delta: {(cur.get('run_duration_seconds') - prev.get('run_duration_seconds')) if cur.get('run_duration_seconds') is not None and prev.get('run_duration_seconds') is not None else 'not available'} seconds",
                        f"- Previous new warning signatures: {prev.get('new_warning_count', 'unknown')}",
                        f"- Current new warning signatures: {cur.get('new_warning_count', 'unknown')}"]
          else: lines += ["","No previous cache baseline was available; this run establishes it."]
          Path("ci-reports/build-history-comparison.md").write_text("\n".join(lines)+"\n")
          PY
          {
            echo "# Unified Flutter CI report"
            echo
            echo "Complete project snapshot: ci-reports/project-source-snapshot.tar.gz"
            echo "Source inventory: ci-reports/source-file-list.txt"
            echo "Source SHA-256: ci-reports/source-manifest.sha256"
            echo "APK inventory and integrity: ci-reports/apk-contents.txt and ci-reports/apk-archive-integrity.log"
            echo "Build comparison: ci-reports/build-history-comparison.md"
             echo "Change impact: ci-reports/change-impact.md"
             echo "Warning analysis: ci-reports/log-analysis.md"
             echo "APK metadata audit: ci-reports/apk-audit.md"
             echo "Quality gates: ci-reports/quality-gates.md"
            echo
            for f in ci-reports/*.log; do
              [[ -f "$f" ]] || continue
              echo
              echo "## Log: $f"
              echo "--- BEGIN FULL LOG ---"
              cat "$f"
              echo "--- END FULL LOG ---"
            done
            for f in ci-reports/coverage-summary.md ci-reports/build-history-comparison.md ci-reports/apk-inventory-summary.txt ci-reports/flutter-dependency-report.log; do
              [[ -f "$f" ]] || continue
              echo
              echo "## Report: $f"
              cat "$f"
            done
          } > ci-reports/unified-report.md
          cat ci-reports/build-history-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update warning baseline only after passing checks
        if: ${{ success() && steps.report-collector.outcome == 'success' && steps.warning-analysis.outcome == 'success' && steps.quality-gates.outcome != 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s ci-reports/warning-signatures.json ]]; then
            mkdir -p .ci-history
            cp ci-reports/warning-signatures.json .ci-history/warning-signatures.json
          fi

      - name: Save build history for the next run
        if: ${{ always() && steps.report-collector.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci-history
          key: flutter-build-history-${{ github.repository_id }}-${{ github.ref_name }}-${{ inputs.target-platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Flutter reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-ci-reports-${{ github.run_id }}
          path: |
            ci-reports/**
            coverage/lcov.info
            test/failures/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write Flutter job summary
        if: ${{ always() }}
        shell: bash
        env:
          ANALYZE_RESULT: ${{ steps.analyze.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          APK_RESULT: ${{ steps.verify-apk.outcome }}
          EMULATOR_RESULT: ${{ steps.emulator.outcome }}
          SCREENSHOT_RESULT: ${{ steps.screenshot-tests.outcome }}
          COVERAGE_RESULT: ${{ steps.coverage-report.outcome }}
          APK_AUDIT_RESULT: ${{ steps.apk-audit.outcome }}
          APK_SMOKE_RESULT: ${{ steps.apk-smoke.outcome }}
          QUALITY_RESULT: ${{ steps.quality-gates.outcome }}
          WARNING_RESULT: ${{ steps.warning-analysis.outcome }}
        run: |
          {
            echo "## Shared Flutter CI"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Analyze | ${ANALYZE_RESULT:-not requested} |"
            echo "| Unit/widget tests | ${TEST_RESULT:-not requested} |"
            echo "| Screenshot/golden comparison | ${SCREENSHOT_RESULT:-not requested} |"
            echo "| Coverage report | ${COVERAGE_RESULT:-not requested} |"
            echo "| Dart format | ${FORMAT_RESULT:-not requested} |"
            echo "| Android emulator | ${EMULATOR_RESULT:-not requested} |"
            echo "| APK build | ${BUILD_RESULT:-not requested} |"
            echo "| APK verification | ${APK_RESULT:-not requested} |"
            echo "| APK metadata audit | ${APK_AUDIT_RESULT:-not requested} |"
            echo "| APK install/launch smoke | ${APK_SMOKE_RESULT:-not requested} |"
            echo "| Configurable quality gates | ${QUALITY_RESULT:-not requested} |"
            echo "| Warning analysis | ${WARNING_RESULT:-not requested} |"
            echo
            echo "Full command logs and reports are available in the workflow logs and uploaded artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  security-audit:
    if: ${{ inputs.run-security-audit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot complete source before security inspection
        id: source-snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          find . -path './.git' -prune -o -path './ci-reports' -prune -o -type f -printf '%P\n' \
            | sort > ci-reports/source-file-list.txt
          find . -path './.git' -prune -o -path './ci-reports' -prune -o -type f -print0 \
            | sort -z | xargs -0 -r sha256sum > ci-reports/source-manifest.sha256
          tar --exclude='./.git' --exclude='./ci-reports' -czf "$RUNNER_TEMP/project-source-snapshot.tar.gz" .
          cp "$RUNNER_TEMP/project-source-snapshot.tar.gz" ci-reports/
          echo "Complete project snapshot captured before Gitleaks and OSV-Scanner inspection." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare report directory
        shell: bash
        run: mkdir -p ci-reports

      - name: Install Gitleaks (free open-source CLI)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.30.0"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error "$BASE_URL/$ARCHIVE" --output "$ARCHIVE"
          curl --fail --location --silent --show-error "$BASE_URL/gitleaks_${VERSION}_checksums.txt" --output gitleaks_checksums.txt
          grep -F "  $ARCHIVE" gitleaks_checksums.txt | sha256sum --check
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history for exposed secrets
        id: gitleaks
        shell: bash
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-security-findings }}
        run: |
          set -uo pipefail
          set +e
          gitleaks detect --source . --redact --report-format json --report-path ci-reports/gitleaks.json 2>&1 | tee ci-reports/gitleaks.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::Gitleaks returned exit code $status. Review ci-reports/gitleaks.json and ci-reports/gitleaks.log."
            if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then exit "$status"; fi
          fi

      - name: Set up Go for OSV-Scanner
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install OSV-Scanner (free open-source CLI)
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/osv-scanner" --version

      - name: Set up Flutter when a lockfile is missing
        if: ${{ hashFiles('pubspec.yaml') != '' && hashFiles('pubspec.lock') == '' }}
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Resolve missing Flutter lockfile for audit without committing changes
        id: resolve-lockfile
        if: ${{ hashFiles('pubspec.yaml') != '' && hashFiles('pubspec.lock') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee ci-reports/flutter-lockfile-resolution.log
          test -s pubspec.lock
          cp pubspec.lock ci-reports/resolved-pubspec.lock
          sha256sum pubspec.lock > ci-reports/resolved-pubspec-lock.sha256
          echo "Generated a runner-local pubspec.lock for OSV scanning; no repository file was committed or upgraded." >> "$GITHUB_STEP_SUMMARY"

      - name: Scan lockfiles for known dependency vulnerabilities
        id: osv
        shell: bash
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-security-findings }}
        run: |
          set -euo pipefail
          if ! find . -path './.git' -prune -o -type f \( -name 'pubspec.lock' -o -name 'gradle.lockfile' -o -name 'buildscript-gradle.lockfile' -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' -o -name 'yarn.lock' -o -name 'Cargo.lock' -o -name 'requirements.txt' -o -name 'poetry.lock' -o -name 'uv.lock' \) -print -quit | grep -q .; then
            echo "::warning::No supported dependency lockfiles found; OSV dependency scan skipped."
            echo "No supported dependency lockfiles found; OSV scan skipped." | tee ci-reports/osv-scan.log
            echo "exit_code=skipped" >> "$GITHUB_OUTPUT"
            if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
              echo "::error::Strict security mode requires a supported dependency lockfile."
              exit 1
            fi
            exit 0
          fi

          set +e
          osv-scanner scan source -r . --format=vertical --output-file=ci-reports/osv-scan.txt 2>&1 | tee ci-reports/osv-scan.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::OSV-Scanner returned exit code $status. Review ci-reports/osv-scan.txt and ci-reports/osv-scan.log."
            if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then exit "$status"; fi
          fi

      - name: Write security summary
        if: ${{ always() }}
        shell: bash
        env:
          GITLEAKS_STATUS: ${{ steps.gitleaks.outputs.exit_code }}
          OSV_STATUS: ${{ steps.osv.outputs.exit_code }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-security-findings }}
        run: |
          {
            echo "# Shared Security Audit"
            echo
            echo "| Scanner | Exit code | Status |"
            echo "|---|---:|---|"
            echo "| Gitleaks | ${GITLEAKS_STATUS:-not completed} | ${GITLEAKS_STATUS:-unknown} |"
            echo "| OSV-Scanner | ${OSV_STATUS:-not completed} | ${OSV_STATUS:-unknown} |"
            echo
            if [[ "$GITLEAKS_STATUS" != "0" && -n "$GITLEAKS_STATUS" ]]; then
              echo "Gitleaks returned a non-zero exit code; inspect gitleaks.json and gitleaks.log."
            fi
            if [[ "$OSV_STATUS" == "skipped" ]]; then
              echo "Dependency scan was skipped because no supported lockfile was available."
            elif [[ "$OSV_STATUS" != "0" && -n "$OSV_STATUS" ]]; then
              echo "OSV-Scanner returned a non-zero exit code; inspect osv-scan.txt and osv-scan.log."
            fi
            echo
            if [[ "$FAIL_ON_FINDINGS" == "true" ]]; then
              echo "Strict security mode is enabled; findings and skipped dependency scans can fail the job."
            else
              echo "Security findings are warnings in this configuration. Review the reports and explicitly enable strict mode when ready."
            fi
          } | tee ci-reports/security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-security-reports-${{ github.run_id }}
          path: ci-reports/**
          if-no-files-found: warn
          retention-days: 14

  attest-apk:
    name: Attest verified APK provenance
    if: ${{ inputs.generate-artifact-attestation && inputs.build-apk && needs.flutter.result == 'success' }}
    needs: [flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified APK from this run
        id: apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/attest-apk"
          mkdir -p "$DEST"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$APK_ARTIFACT_NAME" --dir "$DEST"
          APK_PATH="$(find "$DEST" -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Verified APK fetched from current workflow run." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Document attestation scope
        shell: bash
        run: |
          {
            echo "## APK provenance attestation"
            echo "- Subject: verified release APK uploaded by this workflow run."
            echo "- Provenance links the repository, workflow, commit and event."
            echo "- An attestation proves origin/integrity claims, not absence of bugs."
            echo "Verify the subject with GitHub CLI: gh attestation verify --repo <CALLER_REPOSITORY> <APK_PATH>"
          } >> "$GITHUB_STEP_SUMMARY"

  unified-report:
    name: Collect all per-job reports and analyze logs
    if: ${{ always() && (inputs.run-analyze || inputs.run-tests || inputs.check-format || inputs.build-apk || inputs.run-emulator-tests || inputs.run-security-audit) }}
    needs: [flutter, security-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download all Flutter and security report artifacts
        id: download-reports
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_FLUTTER_REPORT: ${{ inputs.run-analyze || inputs.run-tests || inputs.check-format || inputs.build-apk || inputs.run-emulator-tests }}
          EXPECT_SECURITY_REPORT: ${{ inputs.run-security-audit }}
        run: |
          set -euo pipefail
          mkdir -p combined-reports/jobs
          if [[ "$EXPECT_FLUTTER_REPORT" == "true" || "$EXPECT_SECURITY_REPORT" == "true" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "flutter-*-reports-$GITHUB_RUN_ID" --dir combined-reports/jobs
          else
            echo "No report-producing jobs were requested; artifact download skipped."
          fi

      - name: Analyze logs and generate unified report
        if: ${{ always() }}
        shell: bash
        env:
          FLUTTER_JOB_RESULT: ${{ needs.flutter.result }}
          SECURITY_JOB_RESULT: ${{ needs.security-audit.result }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          EXPECT_FLUTTER_REPORT: ${{ inputs.run-analyze || inputs.run-tests || inputs.check-format || inputs.build-apk || inputs.run-emulator-tests }}
          EXPECT_SECURITY_REPORT: ${{ inputs.run-security-audit }}
          DOWNLOAD_STEP_RESULT: ${{ steps.download-reports.outcome }}
        run: |
          set -euo pipefail
          mkdir -p combined-reports/jobs
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path('combined-reports/jobs')
          run_id = os.environ['WORKFLOW_RUN_ID']
          expected = []
          if os.environ.get('EXPECT_FLUTTER_REPORT', '').lower() == 'true':
              expected.append('flutter-ci-reports-' + run_id)
          if os.environ.get('EXPECT_SECURITY_REPORT', '').lower() == 'true':
              expected.append('flutter-security-reports-' + run_id)
          missing_expected = [name for name in expected if not (root / name).is_dir()]
          files = sorted(p for p in root.rglob('*') if p.is_file())
          logs = [p for p in files if p.suffix.lower() == '.log']
          rules = {
              'errors': re.compile(r'::error::|##\[error\]|\berror\s*[•:]|\berror:', re.I),
              'known_flutter_tool_noise': re.compile(r'Caught exception: Already watching path: .+/android\s*\Z', re.I),
              'exceptions': re.compile(r'^(?!.*Caught exception: Already watching path: .+/android\s*\Z).*(?:Traceback \(most recent call last\)|\bException\b|Caught exception)', re.I),
              'warnings': re.compile(r'::warning::|##\[warning\]|\bwarning\s*[•:]|\bwarning:', re.I),
              'info_lints': re.compile(r'\binfo\s*•', re.I),
          }
          counts = {key: 0 for key in rules}
          findings = []
          for path in logs:
              for number, line in enumerate(path.read_text(errors='replace').splitlines(), 1):
                  categories = [key for key, rule in rules.items() if rule.search(line)]
                  for key in categories:
                      counts[key] += 1
                  if categories:
                      findings.append({'file': str(path), 'line': number, 'categories': categories, 'text': line[:2000]})

          data = {
              'run_id': os.environ['WORKFLOW_RUN_ID'],
              'commit': os.environ['WORKFLOW_COMMIT'],
              'flutter_job_result': os.environ['FLUTTER_JOB_RESULT'],
              'security_job_result': os.environ['SECURITY_JOB_RESULT'],
              'downloaded_files': len(files),
              'log_files_analyzed': len(logs),
              'download_step_result': os.environ.get('DOWNLOAD_STEP_RESULT', 'unknown'),
              'expected_artifacts': expected,
              'missing_expected_artifacts': missing_expected,
              'matches_by_category': counts,
              'matched_lines': findings,
              'files': [{'path': str(p), 'size_bytes': p.stat().st_size} for p in files],
          }
          Path('combined-reports/log-analysis.json').write_text(json.dumps(data, indent=2) + '\n')

          report = [
              '# Unified Flutter Workflow Report', '',
              '- Workflow run: ' + data['run_id'],
              '- Commit: ' + data['commit'],
              '- Flutter job: ' + data['flutter_job_result'],
              '- Security audit job: ' + data['security_job_result'],
              '- Downloaded report files: ' + str(len(files)),
              '- Log files analyzed: ' + str(len(logs)),
              '- Artifact download step: ' + data['download_step_result'],
              '- Missing expected per-job artifacts: ' + str(len(missing_expected)), '',
              '## Artifact download validation', '',
          ]
          if missing_expected:
              report.extend('MISSING REQUIRED ARTIFACT: ' + name for name in missing_expected)
          else:
              report.append('All expected per-job report artifacts were downloaded.')
          report.extend([
              '', '## Automated log analysis', '',
              '| Category | Matching lines |', '|---|---:|'
          ])
          report.extend('| ' + key + ' | ' + str(value) + ' |' for key, value in counts.items())
          report.extend(['', 'Pattern matches are signals for review, not proof of a defect. Original per-job files are preserved in the artifact.', ''])
          if findings:
              report.extend(['## Matched log lines', ''])
              for item in findings[:500]:
                  report.append('- ' + item['file'] + ':' + str(item['line']) + ' (' + ', '.join(item['categories']) + '): ' + item['text'])
              if len(findings) > 500:
                  report.append('- Inline findings capped at 500 of ' + str(len(findings)) + '; log-analysis.json contains all findings.')
          else:
              report.append('No error, warning, exception, or info-lint patterns were found in downloaded log files.')
          report.extend(['', '## Full command logs', ''])
          for path in logs:
              report.extend(['### ' + str(path), '', '~~~text', path.read_text(errors='replace'), '~~~', ''])
          report.extend(['', '## Report inventory', '', '| File | Size (bytes) |', '|---|---:|'])
          report.extend('| ' + str(p) + ' | ' + str(p.stat().st_size) + ' |' for p in files)
          Path('combined-reports/unified-report.md').write_text('\n'.join(report) + '\n')
          print('Downloaded ' + str(len(files)) + ' report files; analyzed ' + str(len(logs)) + ' logs.')
          print('Matches by category: ' + json.dumps(counts, sort_keys=True))
          if missing_expected:
              raise SystemExit('Expected per-job report artifacts are missing: ' + ', '.join(missing_expected))
          PY

      - name: Upload unified report and all per-job reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-complete-report-${{ github.run_id }}
          path: combined-reports/**
          if-no-files-found: error
          retention-days: 14
